paths:
  base_input: templates/parameters_template   # any input pyro reads; code inferred by pyro
  slurm_template: templates/slurm_array.sh
  save_template: templates/slurm_save.sh
  # output_dir_base: scans                  # override for dry runs/tests only; default $GYRO_DATA_OUTPUT
  # executable: $GENE_EXE                  # optional; its size and mtime go in manifest.json

slurm:
  partition: boost_fua_prod
  account: fupb2_qlturb
  time_limit: "02:00:00"
  ntasks: 64
  max_parallel: 50
  # qos: normal   # optional (Pitagora dcgp_fua_prod uses normal); omitted = no --qos line
  setup:
    - module purge
    - module load intel-oneapi-compilers-classic/2021.10.0
    - module load intel-oneapi-mkl/2024.0.0--intel-oneapi-mpi--2021.12.1
    - module load hdf5/1.14.3--intel-oneapi-mpi--2021.12.1--oneapi--2024.1.0
  # expanded by bash when the job runs: export GENE_EXE=/path/to/gene before submitting
  run_command: srun --mpi=pmi2 $GENE_EXE

run:
  dry_run: true
  scan_name: test_001   # project: <CODE>/Runs/<scan_name>/<case>/<leaf>
  case: SPR-045
  # gk_code: GFTM   # optional: convert decks to this code; leaf <CODE> follows it. A scan can override.

scans:
  - name: q_beta        # leaf directory; may contain '/'
    scan:
      - parameter: q0
        attr: local_geometry
        location: [q]
        values: [1.35, 1.5, 1.65]
      - parameter: beta
        attr: numerics
        location: [beta]
        values: [0.01, 0.02]
      - flags:
          - enforce_consistent_beta_prime
      - units: tglf
  - name: shat_ky_n300
    cube:
      - n_samples: 300
      - parameter: ky
        values: [0.1, 1.0]
      - parameter: shat
        attr: local_geometry
        location: [shat]
        values: [0.5, 3.0]
      - flags:
          - seed: 0
      - units: tglf
  # - name: gftm_f05
  #   cube:
  #     - from_directory: {root: $GYRO_DATA_OUTPUT/GS2/Runs/db/M1, pattern: "*", params: [ky, beta], gk_code: GS2}
  #     - gk_code: GFTM
  #     - code_flags: {WIDTH: 0.6, FILTER: 0.5}
