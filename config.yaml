  base_parameters: templates/parameters_template
  slurm_template: templates/slurm_template.sh
  output_dir_base: scans

slurm:
  partition: boost_fua_prod
  account: fupb2_qlturb
  time_limit: "02:00:00"
  poll_interval: 1

run:
  dry_run: false
  name: test_001

scans:
